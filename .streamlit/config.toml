[theme]
base            = "dark"
primaryColor    = "#00D4B4"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A2035"
textColor       = "#E2E8F0"
font            = "sans serif"

[server]
headless        = true
port            = 8501
maxUploadSize   = 10
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode     = "minimal"
